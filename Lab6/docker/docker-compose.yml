# docker run -d \
#   --name my-postgres \
#   -e POSTGRES_PASSWORD=123456 \
#   -p 5432:5432 \
#   postgres:15

version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: my-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: testdb
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: